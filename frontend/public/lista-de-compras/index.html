<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Minha Lista de Compras • Moderna e Rápida</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="src/icons/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="src/icons/favicon.ico">
    <link rel="apple-touch-icon" href="src/icons/icon-512x512.png">
    
    <link rel="stylesheet" href="src/css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifes.json">
    <meta name="theme-color" content="#4F6D7A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <!-- App Bar com Efeito Parallax -->
    <header class="app-bar" id="appBar">
        <button class="menu-btn" onclick="toggleMenu()" aria-label="Menu">
            <img src="src/icons/icon-512x512.png" alt="Menu" class="menu-avatar">
            <span class="ripple"></span>
        </button>
        
        <div class="app-title-wrapper">
            <div class="app-logo floating-logo">
                <img src="src/icons/icon-512x512.png" alt="Lista de Compras" class="app-logo-img">
            </div>
            <h1 class="app-title">Minha Lista</h1>
            <div class="connection-status" id="connectionStatus">
                <span class="status-dot"></span>
                <span class="status-text">Conectado</span>
            </div>
        </div>
        
        <div class="app-actions">
            <button class="action-btn" onclick="compartilharLista()" title="Compartilhar lista" aria-label="Compartilhar">
                <i class="fas fa-share-alt"></i>
                <span class="ripple"></span>
            </button>
            <button class="action-btn" onclick="logout()" title="Sair" aria-label="Sair">
                <i class="fas fa-sign-out-alt"></i>
                <span class="ripple"></span>
            </button>
        </div>
    </header>

    <!-- Menu Lateral Aprimorado -->
    <div class="side-menu" id="sideMenu">
        <div class="menu-header">
            <div class="user-avatar" id="userAvatar">
                <img src="src/icons/icon-512x512.png" alt="Avatar" class="avatar-img">
            </div>
            <div class="user-info">
                <h3 id="userName">Usuário</h3>
                <p id="userEmail">carregando...</p>
            </div>
        </div>
        
        <div class="menu-items">
            <button class="menu-item" onclick="mostrarCategorias()">
                <i class="fas fa-tags"></i>
                <span>Categorias</span>
                <i class="fas fa-chevron-right menu-arrow"></i>
            </button>
            <button class="menu-item" onclick="mostrarHistorico()">
                <i class="fas fa-history"></i>
                <span>Histórico</span>
                <i class="fas fa-chevron-right menu-arrow"></i>
            </button>
            <button class="menu-item" onclick="mostrarConfiguracoes()">
                <i class="fas fa-cog"></i>
                <span>Configurações</span>
                <i class="fas fa-chevron-right menu-arrow"></i>
            </button>
            <button class="menu-item" onclick="mostrarAjuda()">
                <i class="fas fa-question-circle"></i>
                <span>Ajuda</span>
                <i class="fas fa-chevron-right menu-arrow"></i>
            </button>
        </div>
        
        <div class="menu-footer">
            <button class="logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>
                <span>Sair da conta</span>
            </button>
        </div>
    </div>

    <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>

    <!-- Pull-to-Refresh Indicator -->
    <div class="pull-to-refresh" id="pullToRefresh">
        <i class="fas fa-arrow-down"></i>
        <span>Puxe para atualizar</span>
    </div>

    <!-- Conteúdo Principal com Scroll Suave -->
    <main class="main-content" id="mainContent">
        <!-- Resumo da Lista com Animação -->
        <div class="list-summary">
            <div class="summary-card" data-delay="0">
                <div class="summary-icon">
                    <i class="fas fa-list-check"></i>
                </div>
                <div class="summary-info">
                    <span class="summary-label">Total de itens</span>
                    <span class="summary-value" id="totalItems">0</span>
                </div>
            </div>
            
            <div class="summary-card" data-delay="0.1">
                <div class="summary-icon">
                    <i class="fas fa-circle-check"></i>
                </div>
                <div class="summary-info">
                    <span class="summary-label">Comprados</span>
                    <span class="summary-value" id="checkedItems">0</span>
                </div>
            </div>
            
            <div class="summary-card" data-delay="0.2">
                <div class="summary-icon">
                    <i class="fas fa-clock"></i>
                </div>
                <div class="summary-info">
                    <span class="summary-label">Pendentes</span>
                    <span class="summary-value" id="pendingItems">0</span>
                </div>
            </div>
        </div>

        <!-- Filtros com Swipe Support -->
        <div class="filter-section">
            <button class="filter-btn active" onclick="filtrarLista('todos')">
                <i class="fas fa-list"></i>
                <span>Todos</span>
            </button>
            <button class="filter-btn" onclick="filtrarLista('pendentes')">
                <i class="fas fa-clock"></i>
                <span>Pendentes</span>
            </button>
            <button class="filter-btn" onclick="filtrarLista('comprados')">
                <i class="fas fa-check-circle"></i>
                <span>Comprados</span>
            </button>
        </div>

        <!-- Lista com Skeleton Loading -->
        <div class="list-container" id="listContainer">
            <div class="skeleton-loading" id="skeletonLoading">
                <div class="skeleton-item"></div>
                <div class="skeleton-item"></div>
                <div class="skeleton-item"></div>
            </div>
            
            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-state-animation">
                    <i class="fas fa-shopping-basket"></i>
                </div>
                <h3>Lista vazia por enquanto</h3>
                <p>Adicione itens com o botão + abaixo</p>
                <button class="empty-state-btn" onclick="focusAddInput()">
                    <i class="fas fa-plus-circle"></i> Adicionar primeiro item
                </button>
            </div>
            
            <ul class="shopping-list" id="lista"></ul>
        </div>
    </main>

    <!-- Barra Flutuante de Adição (Redesign) -->
    <div class="fab-container">
        <div class="fab-menu" id="fabMenu">
            <button class="fab-option" onclick="adicionarSugestao('Pão')">
                <i class="fas fa-bread-slice"></i>
            </button>
            <button class="fab-option" onclick="adicionarSugestao('Leite')">
                <i class="fas fa-milk"></i>
            </button>
            <button class="fab-option" onclick="adicionarSugestao('Ovos')">
                <i class="fas fa-egg"></i>
            </button>
            <button class="fab-option" onclick="adicionarSugestao('Arroz')">
                <i class="fas fa-wheat"></i>
            </button>
        </div>
        
        <div class="add-item-bar-mobile" id="addBar">
            <input 
                type="text" 
                id="item" 
                class="add-item-input-mobile" 
                placeholder="Digite um item..."
                autocomplete="off"
            >
            <button class="add-item-btn-mobile" onclick="adicionarItem()">
                <i class="fas fa-plus"></i>
            </button>
        </div>
        
        <button class="fab-main" id="fabMain" onclick="toggleFab()">
            <i class="fas fa-plus"></i>
            <i class="fas fa-times"></i>
        </button>
    </div>

    <!-- Toast Aprimorado -->
    <div class="toast-modern" id="toast">
        <div class="toast-icon">
            <i class="fas fa-info-circle"></i>
        </div>
        <div class="toast-content">
            <span id="toastMessage">Mensagem</span>
        </div>
        <div class="toast-progress"></div>
    </div>

    <!-- Bottom Sheet para Configurações Rápidas -->
    <div class="bottom-sheet" id="bottomSheet">
        <div class="bottom-sheet-header">
            <div class="drag-handle"></div>
        </div>
        <div class="bottom-sheet-content" id="bottomSheetContent">
            <h3>Opções Rápidas</h3>
            <button onclick="alternarModoNoturno()">
                <i class="fas fa-moon"></i> Modo Noturno
            </button>
            <button onclick="ordenarLista()">
                <i class="fas fa-sort-alpha-down"></i> Ordenar itens
            </button>
            <button onclick="limparComprados()">
                <i class="fas fa-trash-alt"></i> Limpar comprados
            </button>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabaseClient.js';

        window.supabase = supabase;
        
        let listaAtual = [];
        let filtroAtual = 'todos';
        let usuarioAtual = null;
        let startY = 0;
        let isRefreshing = false;

        // Inicialização com animações
        document.addEventListener('DOMContentLoaded', async () => {
            await carregarUsuario();
            await carregarLista();
            configurarRealtime();
            configurarServiceWorker();
            configurarGestos();
            configurarTecladoMobile();
            verificarModoNoturno();
            
            // Animar cards de resumo
            document.querySelectorAll('.summary-card').forEach((card, index) => {
                card.style.animation = `fadeInUp 0.5s ease ${index * 0.1}s forwards`;
                card.style.opacity = '0';
            });
        });

        async function carregarUsuario() {
            try {
                const { data: { user } } = await supabase.auth.getUser();
                if (user) {
                    usuarioAtual = user;
                    document.getElementById('userEmail').textContent = user.email;
                    document.getElementById('userName').textContent = user.email.split('@')[0];
                }
            } catch (error) {
                console.error('Erro ao carregar usuário:', error);
            }
        }

        async function carregarLista() {
            mostrarSkeleton(true);
            try {
                const { data, error } = await supabase
                    .from('items')
                    .select('*')
                    .order('created_at', { ascending: true });

                if (error) throw error;
                
                listaAtual = data || [];
                renderizarLista();
                atualizarResumo();
                hapticFeedback('light');
            } catch (error) {
                console.error('Erro ao carregar lista:', error);
                mostrarToast('Erro ao carregar lista', 'error');
            } finally {
                mostrarSkeleton(false);
            }
        }

        function mostrarSkeleton(show) {
            const skeleton = document.getElementById('skeletonLoading');
            const lista = document.getElementById('lista');
            const emptyState = document.getElementById('emptyState');
            
            if (show) {
                skeleton.style.display = 'block';
                lista.style.display = 'none';
                emptyState.style.display = 'none';
            } else {
                skeleton.style.display = 'none';
            }
        }

        function renderizarLista() {
            const listaElement = document.getElementById('lista');
            const emptyState = document.getElementById('emptyState');
            
            let itensFiltrados = listaAtual;
            
            if (filtroAtual === 'pendentes') {
                itensFiltrados = listaAtual.filter(item => !item.comprado);
            } else if (filtroAtual === 'comprados') {
                itensFiltrados = listaAtual.filter(item => item.comprado);
            }
            
            if (itensFiltrados.length === 0) {
                listaElement.style.display = 'none';
                emptyState.style.display = 'block';
                emptyState.style.animation = 'fadeIn 0.3s ease';
                return;
            }
            
            listaElement.style.display = 'block';
            emptyState.style.display = 'none';
            
            listaElement.innerHTML = itensFiltrados.map((item, index) => `
                <li class="list-item ${item.comprado ? 'checked' : ''}" 
                    data-id="${item.id}"
                    style="animation: slideInRight 0.3s ease ${index * 0.05}s backwards">
                    
                    <button class="item-checkbox" onclick="toggleItem('${item.id}')">
                        <i class="fas ${item.comprado ? 'fa-check-circle' : 'fa-circle'}"></i>
                    </button>
                    
                    <span class="item-text">${escapeHtml(item.nome)}</span>
                    
                    <div class="item-actions">
                        <button class="item-action-btn edit" onclick="editarItem('${item.id}')">
                            <i class="fas fa-pen"></i>
                        </button>
                        <button class="item-action-btn delete" onclick="removerItem('${item.id}')">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </li>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function atualizarResumo() {
            const total = listaAtual.length;
            const comprados = listaAtual.filter(item => item.comprado).length;
            const pendentes = total - comprados;
            
            animateValue('totalItems', total);
            animateValue('checkedItems', comprados);
            animateValue('pendingItems', pendentes);
        }

        function animateValue(elementId, newValue) {
            const element = document.getElementById(elementId);
            const oldValue = parseInt(element.textContent);
            if (oldValue === newValue) return;
            
            let start = oldValue;
            const end = newValue;
            const duration = 300;
            const startTime = performance.now();
            
            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const current = Math.floor(start + (end - start) * easeOutCubic(progress));
                element.textContent = current;
                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }
            
            requestAnimationFrame(update);
        }

        function easeOutCubic(x) {
            return 1 - Math.pow(1 - x, 3);
        }

        window.adicionarItem = async function() {
            const input = document.getElementById('item');
            const nome = input.value.trim();
            
            if (!nome) {
                mostrarToast('Digite um item para adicionar', 'warning');
                hapticFeedback('warning');
                return;
            }
            
            try {
                const { error } = await supabase
                    .from('items')
                    .insert([{ 
                        nome: nome, 
                        comprado: false,
                        user_id: usuarioAtual?.id 
                    }]);
                
                if (error) throw error;
                
                input.value = '';
                mostrarToast('Item adicionado! ✨', 'success');
                hapticFeedback('success');
                fecharFab();
                
            } catch (error) {
                console.error('Erro ao adicionar:', error);
                mostrarToast('Erro ao adicionar item', 'error');
                hapticFeedback('error');
            }
        };

        window.toggleItem = async function(id) {
            const item = listaAtual.find(i => i.id === id);
            if (!item) return;
            
            // Animação de clique
            const element = document.querySelector(`.list-item[data-id="${id}"]`);
            if (element) {
                element.style.transform = 'scale(0.98)';
                setTimeout(() => {
                    element.style.transform = '';
                }, 150);
            }
            
            try {
                const { error } = await supabase
                    .from('items')
                    .update({ comprado: !item.comprado })
                    .eq('id', id);
                
                if (error) throw error;
                
                hapticFeedback('light');
                
            } catch (error) {
                console.error('Erro ao atualizar:', error);
                mostrarToast('Erro ao atualizar item', 'error');
            }
        };

        window.removerItem = async function(id) {
            const element = document.querySelector(`.list-item[data-id="${id}"]`);
            
            // Animação de saída
            if (element) {
                element.style.animation = 'slideOutLeft 0.3s ease forwards';
                await new Promise(resolve => setTimeout(resolve, 200));
            }
            
            if (!confirm('Remover este item?')) return;
            
            try {
                const { error } = await supabase
                    .from('items')
                    .delete()
                    .eq('id', id);
                
                if (error) throw error;
                
                mostrarToast('Item removido', 'info');
                hapticFeedback('light');
                
            } catch (error) {
                console.error('Erro ao remover:', error);
                mostrarToast('Erro ao remover item', 'error');
            }
        };

        window.editarItem = async function(id) {
            const item = listaAtual.find(i => i.id === id);
            if (!item) return;
            
            const novoNome = prompt('Editar item:', item.nome);
            if (!novoNome || novoNome === item.nome) return;
            
            try {
                const { error } = await supabase
                    .from('items')
                    .update({ nome: novoNome })
                    .eq('id', id);
                
                if (error) throw error;
                
                mostrarToast('Item atualizado', 'success');
                hapticFeedback('light');
                
            } catch (error) {
                console.error('Erro ao editar:', error);
                mostrarToast('Erro ao editar item', 'error');
            }
        };

        window.filtrarLista = function(filtro) {
            filtroAtual = filtro;
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.closest('.filter-btn').classList.add('active');
            
            renderizarLista();
            hapticFeedback('light');
        };

        // Gestos e interações mobile
        function configurarGestos() {
            let touchStartX = 0;
            let touchEndX = 0;
            
            document.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            });
            
            document.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            });
            
            function handleSwipe() {
                const swipeDistance = touchEndX - touchStartX;
                if (Math.abs(swipeDistance) > 100) {
                    if (swipeDistance > 0) {
                        // Swipe direita - abrir menu
                        toggleMenu();
                    } else {
                        // Swipe esquerda - fechar menu
                        document.getElementById('sideMenu').classList.remove('open');
                        document.getElementById('menuOverlay').classList.remove('open');
                    }
                }
            }
            
            // Pull to refresh
            const mainContent = document.getElementById('mainContent');
            let startY = 0;
            
            mainContent.addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
            });
            
            mainContent.addEventListener('touchmove', (e) => {
                const currentY = e.touches[0].clientY;
                const scrollTop = mainContent.scrollTop;
                
                if (scrollTop === 0 && currentY > startY + 50 && !isRefreshing) {
                    e.preventDefault();
                    iniciarRefresh();
                }
            });
        }
        
        async function iniciarRefresh() {
            if (isRefreshing) return;
            isRefreshing = true;
            
            const pullToRefresh = document.getElementById('pullToRefresh');
            pullToRefresh.classList.add('active');
            
            await carregarLista();
            
            setTimeout(() => {
                pullToRefresh.classList.remove('active');
                isRefreshing = false;
                mostrarToast('Lista atualizada!', 'success');
            }, 1000);
        }

        function configurarTecladoMobile() {
            const input = document.getElementById('item');
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    adicionarItem();
                }
            });
        }

        // FAB Menu
        window.toggleFab = function() {
            const fabMenu = document.getElementById('fabMenu');
            const fabMain = document.getElementById('fabMain');
            const addBar = document.getElementById('addBar');
            
            fabMenu.classList.toggle('active');
            fabMain.classList.toggle('active');
            addBar.classList.toggle('active');
            
            if (addBar.classList.contains('active')) {
                document.getElementById('item').focus();
            }
        };
        
        function fecharFab() {
            const fabMenu = document.getElementById('fabMenu');
            const fabMain = document.getElementById('fabMain');
            const addBar = document.getElementById('addBar');
            
            fabMenu.classList.remove('active');
            fabMain.classList.remove('active');
            addBar.classList.remove('active');
        }
        
        window.focusAddInput = function() {
            toggleFab();
        };

        window.adicionarSugestao = function(item) {
            document.getElementById('item').value = item;
            adicionarItem();
            fecharFab();
        };

        window.compartilharLista = function() {
            const texto = listaAtual
                .map(item => `${item.comprado ? '✓' : '○'} ${item.nome}`)
                .join('\n');
            
            if (navigator.share) {
                navigator.share({
                    title: 'Minha Lista de Compras',
                    text: texto
                }).catch(() => {});
            } else {
                navigator.clipboard?.writeText(texto);
                mostrarToast('Lista copiada! 📋', 'success');
            }
        };

        function alternarModoNoturno() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark);
            mostrarToast(isDark ? 'Modo noturno ativado 🌙' : 'Modo claro ativado ☀️', 'info');
        }
        
        function verificarModoNoturno() {
            const savedMode = localStorage.getItem('darkMode');
            if (savedMode === 'true') {
                document.body.classList.add('dark-mode');
            }
        }
        
        function ordenarLista() {
            listaAtual.sort((a, b) => a.nome.localeCompare(b.nome));
            renderizarLista();
            mostrarToast('Lista ordenada! 🔤', 'success');
        }
        
        function limparComprados() {
            if (confirm('Remover todos os itens comprados?')) {
                const comprados = listaAtual.filter(item => item.comprado);
                comprados.forEach(async (item) => {
                    await supabase.from('items').delete().eq('id', item.id);
                });
                mostrarToast('Itens comprados removidos!', 'success');
            }
        }

        window.logout = async function() {
            if (confirm('Deseja sair da sua conta?')) {
                await supabase.auth.signOut();
                window.location.href = 'login.html';
            }
        };

        window.toggleMenu = function() {
            document.getElementById('sideMenu').classList.toggle('open');
            document.getElementById('menuOverlay').classList.toggle('open');
        };

        function mostrarBottomSheet() {
            const sheet = document.getElementById('bottomSheet');
            sheet.classList.add('open');
        }

        window.mostrarCategorias = () => mostrarToast('Funcionalidade em desenvolvimento', 'info');
        window.mostrarHistorico = () => mostrarToast('Funcionalidade em desenvolvimento', 'info');
        window.mostrarConfiguracoes = () => mostrarBottomSheet();
        window.mostrarAjuda = () => mostrarToast('help@listacompras.app', 'info');

        function hapticFeedback(type = 'light') {
            if (window.navigator && window.navigator.vibrate) {
                if (type === 'light') window.navigator.vibrate(10);
                if (type === 'success') window.navigator.vibrate([10, 30, 10]);
                if (type === 'error') window.navigator.vibrate([50, 30, 50]);
                if (type === 'warning') window.navigator.vibrate([30, 20, 30]);
            }
        }

        function mostrarToast(mensagem, tipo = 'info') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const icon = toast.querySelector('.toast-icon i');
            
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };
            
            icon.className = `fas ${icons[tipo]}`;
            toast.className = `toast-modern ${tipo}`;
            toastMessage.textContent = mensagem;
            
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function configurarRealtime() {
            supabase
                .channel('items-changes')
                .on('postgres_changes', 
                    { event: '*', schema: 'public', table: 'items' },
                    () => carregarLista()
                )
                .subscribe();
        }

        function configurarServiceWorker() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('service.worker.js')
                    .then(reg => console.log('SW registrado'))
                    .catch(err => console.log('Erro SW:', err));
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                fecharFab();
                document.getElementById('sideMenu').classList.remove('open');
                document.getElementById('menuOverlay').classList.remove('open');
                document.getElementById('bottomSheet').classList.remove('open');
            }
        });
    </script>
</body>
</html>
